{% extends "base.html" %}

  <div style="font-size: 4rem; color: #fde047; margin-bottom: 1rem;">403</div>
  <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">Access Forbidden</h2>

  <div>

</div>
{% endblock %}
