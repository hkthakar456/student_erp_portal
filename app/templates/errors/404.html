{% extends "base.html" %}

{% block title %}Page Not Found &mdash; Beacon ERP{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 4rem auto; text-align: center; padding: 3rem 2rem;">
  <div style="font-size: 4rem; color: #cbd5e1; margin-bottom: 1rem;">404</div>
  <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">Page Not Found</h2>
  <p style="color: var(--text-secondary); margin-bottom: 2rem;">
    The requested student record, course, or resource could not be found or has been moved.
  </p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
