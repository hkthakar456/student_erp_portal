{% extends "base.html" %}

{% block title %}System Error &mdash; Beacon ERP{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 4rem auto; text-align: center; padding: 3rem 2rem;">
  <div style="font-size: 4rem; color: #fca5a5; margin-bottom: 1rem;">500</div>
  <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--text-primary);">Server Processing Error</h2>
  <p style="color: var(--text-secondary); margin-bottom: 2rem;">
    An unexpected condition occurred while processing this request. The system administrator has been notified.
  </p>
  <div>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Return to Dashboard</a>
  </div>
</div>
{% endblock %}
