<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Beacon ERP - A modern, secure, and responsive Student Management Portal for higher education course administration, attendance, and grading.">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-layout">
    {% include "components/sidebar.html" %}

    <div class="app-main">
      {% include "components/navbar.html" %}

      <main class="content-body">
        {% include "components/flash_messages.html" %}
        {% block content %}{% endblock %}
      </main>

      {% include "components/footer.html" %}
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
